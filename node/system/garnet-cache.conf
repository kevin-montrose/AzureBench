{
  "Address": "$eth1",
  "Port": $port,
  "EnableCluster": true,
  "EnableStorageTier": false,
  "IndexSize": "1g",
  "LogMemorySize": "16g",
  "GossipSamplePercent": 50,
  "MetricsSamplingFrequency": 5,

  "EnableAOF": true, 
  "UseAofNullDevice": true, 
  "FastAofTruncate": true, 
  "CommitFrequencyMs": -1, 
  "AofPhysicalSublogCount": 1, 
  "AofMemorySize": "16g", 
  "AofPageSize": "128m",

  "EnableTLS": true,
  "CertFileName" : "/var/lib/garnet/certificate.pfx",
	"CertPassword" : "AzureBench",
	"CertificateRefreshFrequency" : 300,
	"ClientCertificateRequired" : false,
	"ServerCertificateRequired" : false,
}
