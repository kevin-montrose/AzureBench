# Valkey/Redis - AOF on Ramdisk Cluster Configuration
# Placeholders: $eth1 (resolved per-node), $port (resolved per-instance)
# Requires: setup-ramdisk.sh to mount ramdisk before starting

bind $eth1
port $port
protected-mode no
daemonize yes
logfile /home/guser/valkey-cluster/$port/valkey.log
dir $ramdisk/valkey-cluster/$port

# Cluster
cluster-enabled yes
cluster-config-file nodes-$port.conf
cluster-node-timeout 5000
cluster-announce-ip $eth1

# Persistence (AOF on ramdisk)
save ""

# Memory
maxmemory-policy allkeys-lru

# Performance
io-threads 6
io-threads-do-reads yes
tcp-backlog 16384
hz 100

# Expand the global replication backlog to hold more command history.
# Prevents replicas from falling out of sync and triggering heavy full resyncs.
repl-backlog-size 1gb

# Keep the backlog allocated in memory even if all replicas temporarily disconnect.
repl-backlog-ttl 0

# --- OUTPUT BUFFER SAFETY NET ---

# Format: client-output-buffer-limit <class> <hard_limit> <soft_limit> <soft_seconds>
# Greatly increases the allowed memory queue size for lagging replicas.
client-output-buffer-limit replica 1gb 512mb 60

# --- PERFORMANCE OPTIMIZATIONS ---

# Disable TCP nodelay to send larger, batched packets to replicas (saves bandwidth).
repl-disable-tcp-nodelay yes

# Enable diskless replication if your master has slow disks but fast networks.
repl-diskless-sync yes
repl-diskless-sync-delay 5